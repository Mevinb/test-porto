
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Discovered in the initial HTML, not behind the CSS bundle: an @import
         chain would serialize app CSS -> font CSS -> WOFF2 on the critical path. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />

    <!-- Hero portrait is the LCP element; fetch it alongside the JS bundle
         instead of waiting for React to mount and discover the <picture>. -->
    <link
      rel="preload"
      as="image"
      href="/images/mevin-portrait.webp"
      imagesrcset="/images/mevin-portrait-400.webp 400w, /images/mevin-portrait.webp 706w"
      imagesizes="(min-width: 1024px) 430px, 90vw"
      type="image/webp"
      fetchpriority="high"
    />

    <title>Mevin Benty | AI Systems &amp; Software Engineer</title>
    <meta
      name="description"
      content="Mevin Benty builds generative imaging pipelines, secure backend systems, open-source tools, and Linux GPU automation. Explore selected engineering work."
    />
    <meta name="author" content="Mevin Benty" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://mevin.tech/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mevin Benty | AI Systems &amp; Software Engineer" />
    <meta
      property="og:description"
      content="Selected work across generative imaging, secure systems, backend execution, and Linux GPU automation."
    />
    <meta property="og:url" content="https://mevin.tech/" />
    <meta property="og:image" content="https://mevin.tech/mevin-portfolio-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mevin Benty developer portfolio preview" />
    <meta property="og:site_name" content="Mevin Benty Portfolio" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mevin Benty | AI Systems &amp; Software Engineer" />
    <meta
      name="twitter:description"
      content="Selected work across generative imaging, secure systems, backend execution, and Linux GPU automation."
    />
    <meta name="twitter:image" content="https://mevin.tech/mevin-portfolio-og.png" />
    <meta name="twitter:image:alt" content="Mevin Benty developer portfolio preview" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://mevin.tech/#mevin",
            "name": "Mevin Benty",
            "url": "https://mevin.tech/",
            "description": "Software developer and engineering student focused on AI pipelines, secure backend systems, open-source tools, and modern web applications.",
            "sameAs": [
              "https://github.com/Mevinb",
              "https://www.linkedin.com/in/mevin-benty-17305a322"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://mevin.tech/#website",
            "url": "https://mevin.tech/",
            "name": "Mevin Benty Portfolio",
            "description": "The personal developer portfolio of Mevin Benty.",
            "inLanguage": "en",
            "publisher": { "@id": "https://mevin.tech/#mevin" }
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
